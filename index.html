<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESSWARE - Stockfish 18</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .square-light { background-color: #f0d9b5; }
        .square-dark { background-color: #b58863; }
        .selected-square { background-color: #baca44 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black tracking-wider text-indigo-400">CHESSWARE</span>
            <span class="text-xs uppercase bg-indigo-900 text-indigo-200 px-2 py-0.5 rounded font-semibold">Stockfish 18</span>
        </div>
        <div class="flex items-center space-x-4 text-sm">
            <div id="engine-status" class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded border border-slate-700">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text" class="font-medium text-slate-300">Loading SF18 Engine...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Board & Evaluation Bar -->
        <section class="lg:col-span-7 flex flex-col items-center">
            <div class="flex w-full max-w-[520px] bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-xl space-x-4 items-center">
                <!-- Evaluation Bar -->
                <div class="w-6 h-[480px] bg-slate-900 rounded overflow-hidden flex flex-col justify-end border border-slate-700 relative">
                    <div id="eval-fill" class="bg-slate-200 w-full transition-all duration-300" style="height: 50%;"></div>
                    <span id="eval-number" class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-900 bg-slate-200/80">+0.00</span>
                </div>
                <!-- Native Custom Chessboard Grid Container -->
                <div id="custom-board" class="w-[480px] h-[480px] grid grid-cols-8 grid-rows-8 border-4 border-slate-700 rounded shadow-lg select-none"></div>
            </div>

            <!-- Board Controls -->
            <div class="flex flex-wrap gap-2 mt-4 w-full max-w-[520px] justify-between">
                <div class="flex gap-2">
                    <button id="btn-start" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-medium border border-slate-700 transition">|&lt;</button>
                    <button id="btn-prev" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-medium border border-slate-700 transition">&lt;</button>
                    <button id="btn-next" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-medium border border-slate-700 transition">&gt;</button>
                    <button id="btn-end" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-medium border border-slate-700 transition">&gt;|</button>
                </div>
                <div class="flex gap-2">
                    <button id="btn-flip" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-medium border border-slate-700 transition">Flip</button>
                    <button id="btn-reset" class="px-4 py-2 bg-rose-900/40 hover:bg-rose-900/60 text-rose-200 rounded font-medium border border-rose-700 transition">Reset</button>
                </div>
            </div>
        </section>

        <!-- Right Column: Analysis & Move History -->
        <section class="lg:col-span-5 flex flex-col space-y-6">
            
            <!-- Engine Telemetry & Analysis Panel -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl flex flex-col space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="font-bold text-indigo-400">Stockfish 18 Analysis</h2>
                    <span id="engine-depth" class="text-xs bg-slate-900 px-2 py-1 rounded text-slate-300 border border-slate-700">Depth: 0</span>
                </div>
                <div class="text-sm space-y-2">
                    <div class="flex justify-between">
                        <span class="text-slate-400">Best Move:</span>
                        <span id="engine-bestmove" class="font-mono font-bold text-emerald-400">-</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block mb-1">Principal Variation:</span>
                        <div id="engine-pv" class="bg-slate-900 p-2.5 rounded font-mono text-xs text-slate-300 border border-slate-700 min-h-[48px] max-h-24 overflow-y-auto">Initializing engine worker...</div>
                    </div>
                </div>
            </div>

            <!-- Move History & Actions -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl flex flex-col flex-1 min-h-[220px]">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
                    <h2 class="font-bold text-indigo-400">Move History</h2>
                </div>
                <div id="move-history" class="flex-1 bg-slate-900 rounded p-3 font-mono text-sm overflow-y-auto max-h-48 border border-slate-700 flex flex-wrap content-start gap-1">
                    <span class="text-slate-500 italic">No moves yet.</span>
                </div>
                
                <!-- FEN / PGN Loaders -->
                <div class="mt-4 pt-3 border-t border-slate-700 flex gap-2">
                    <input type="text" id="load-fen-input" placeholder="Paste FEN or PGN..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    <button id="btn-load-fen" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-xs font-medium transition">Load</button>
                </div>
            </div>

        </section>

    </main>

    <!-- Application Script -->
    <script>
        const game = new Chess();
        let historyStates = [game.fen()];
        let currentHistoryIndex = 0;
        let isFlipped = false;
        let selectedSquare = null;
        let stockfish = null;

        const pieceSymbols = {
            'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
            'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♙'
        };

        const evalFill = document.getElementById('eval-fill');
        const evalNumber = document.getElementById('eval-number');
        const engineDepth = document.getElementById('engine-depth');
        const engineBestmove = document.getElementById('engine-bestmove');
        const enginePv = document.getElementById('engine-pv');
        const moveHistoryContainer = document.getElementById('move-history');
        const customBoard = document.getElementById('custom-board');

        function initStockfish() {
            try {
                // Use the official Stockfish 18 single-file ASM distribution via jsDelivr to avoid external WASM block errors
                const workerScript = `
                    importScripts('https://cdn.jsdelivr.net/npm/stockfish@18.0.8/stockfish-18-asm.js');
                    // Fallback initialization for direct global scope worker execution
                    if (typeof Stockfish === 'function') {
                        var sf = Stockfish();
                        sf.onmessage = function(event) { postMessage(event); };
                        onmessage = function(event) { sf.postMessage(event.data); };
                    }
                `;
                const blob = new Blob([workerScript], { type: 'application/javascript' });
                stockfish = new Worker(URL.createObjectURL(blob));

                stockfish.onmessage = function(event) {
                    let msg = event.data;
                    if (typeof msg === 'object' && msg !== null && msg.data) {
                        msg = msg.data;
                    }
                    parseEngineMessage(msg);
                };

                stockfish.postMessage('uci');
                stockfish.postMessage('isready');
            } catch (e) {
                document.getElementById('status-dot').className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                document.getElementById('status-text').textContent = 'Engine Error';
            }
        }

        function parseEngineMessage(msg) {
            if (typeof msg !== 'string') return;

            if (msg === 'readyok') {
                document.getElementById('status-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                document.getElementById('status-text').textContent = 'Stockfish 18 Ready';
                triggerAnalysis();
            }

            if (msg.includes('pv') || msg.includes('score')) {
                let depthMatch = msg.match(/depth\s+(\d+)/);
                let scoreMatch = msg.match(/score\s+(cp|mate)\s+(-?\d+)/);
                let pvMatch = msg.match(/pv\s+(.*)/);

                if (depthMatch) {
                    engineDepth.textContent = `Depth: ${depthMatch[1]}`;
                }

                if (scoreMatch) {
                    let scoreType = scoreMatch[1];
                    let scoreVal = parseInt(scoreMatch[2], 10);
                    let formattedScore = '';

                    if (scoreType === 'cp') {
                        let evalFloat = scoreVal / 100.0;
                        formattedScore = (evalFloat >= 0 ? '+' : '') + evalFloat.toFixed(2);
                        updateEvalBar(evalFloat);
                    } else if (scoreType === 'mate') {
                        formattedScore = `Mate in ${Math.abs(scoreVal)}`;
                        updateEvalBar(scoreVal > 0 ? 10 : -10);
                    }
                    evalNumber.textContent = formattedScore;
                }

                if (pvMatch) {
                    let pvMoves = pvMatch[1].split(' ');
                    engineBestmove.textContent = pvMoves[0];
                    enginePv.textContent = pvMatch[1];
                }
            }
        }

        function triggerAnalysis() {
            if (!stockfish) return;
            stockfish.postMessage('stop');
            stockfish.postMessage(`position fen ${game.fen()}`);
            stockfish.postMessage('go depth 15');
        }

        function updateEvalBar(evalFloat) {
            let winRate = 1 / (1 + Math.pow(10, -evalFloat / 4.0));
            let percentage = Math.max(3, Math.min(97, winRate * 100));
            evalFill.style.height = `${percentage}%`;
        }

        function renderBoard() {
            customBoard.innerHTML = '';
            const boardState = game.board();
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const actualR = isFlipped ? 7 - r : r;
                    const actualF = isFlipped ? 7 - f : f;
                    const squareName = files[actualF] + ranks[actualR];
                    
                    const squareEl = document.createElement('div');
                    squareEl.className = `w-full h-full flex items-center justify-center text-4xl cursor-pointer relative ${(r + f) % 2 === 0 ? 'square-light' : 'square-dark'}`;
                    
                    if (selectedSquare === squareName) {
                        squareEl.classList.add('selected-square');
                    }

                    const piece = boardState[actualR][actualF];
                    if (piece) {
                        const pieceKey = piece.color + piece.type.toUpperCase();
                        const pieceSpan = document.createElement('span');
                        pieceSpan.textContent = pieceSymbols[pieceKey];
                        
                        if (piece.color === 'w') {
                            pieceSpan.style.color = '#ffffff';
                            pieceSpan.style.textShadow = '0 1px 2px rgba(0,0,0,0.8)';
                        } else {
                            pieceSpan.style.color = '#111827';
                            pieceSpan.style.textShadow = '0 1px 2px rgba(255,255,255,0.4)';
                        }
                        squareEl.appendChild(pieceSpan);
                    }

                    squareEl.addEventListener('click', () => handleSquareClick(squareName));
                    customBoard.appendChild(squareEl);
                }
            }
        }

        function handleSquareClick(square) {
            if (game.game_over()) return;

            if (!selectedSquare) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                selectedSquare = null;
                if (move === null) {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    }
                    renderBoard();
                    return;
                }

                if (currentHistoryIndex < historyStates.length - 1) {
                    historyStates = historyStates.slice(0, currentHistoryIndex + 1);
                }

                historyStates.push(game.fen());
                currentHistoryIndex = historyStates.length - 1;
                renderBoard();
                updateMoveHistory();
                triggerAnalysis();
            }
        }

        function updateMoveHistory() {
            const history = game.history({ verbose: true });
            if (history.length === 0) {
                moveHistoryContainer.innerHTML = '<span class="text-slate-500 italic">No moves yet.</span>';
                return;
            }
            let html = '';
            let moveNum = 1;
            for (let i = 0; i < history.length; i++) {
                const ply = i + 1;
                const m = history[i];
                if (ply % 2 !== 0) html += `<span class="text-slate-500 mr-1">${moveNum}.</span>`;
                const isCurrent = (currentHistoryIndex === ply);
                html += `<span class="cursor-pointer px-1 rounded ${isCurrent ? 'bg-indigo-900 text-indigo-200 font-bold' : 'hover:bg-slate-800 text-slate-200'}" onclick="jumpToPly(${ply})">${m.san}</span> `;
                if (ply % 2 === 0) moveNum++;
            }
            moveHistoryContainer.innerHTML = html;
            moveHistoryContainer.scrollTop = moveHistoryContainer.scrollHeight;
        }

        window.jumpToPly = function(plyIdx) {
            if (plyIdx < 0 || plyIdx >= historyStates.length) return;
            currentHistoryIndex = plyIdx;
            game.load(historyStates[currentHistoryIndex]);
            selectedSquare = null;
            renderBoard();
            updateMoveHistory();
            triggerAnalysis();
        };

        $(document).ready(() => {
            renderBoard();
            initStockfish();

            $('#btn-start').click(() => jumpToPly(0));
            $('#btn-prev').click(() => jumpToPly(currentHistoryIndex - 1));
            $('#btn-next').click(() => jumpToPly(currentHistoryIndex + 1));
            $('#btn-end').click(() => jumpToPly(historyStates.length - 1));
            $('#btn-reset').click(() => {
                game.reset();
                historyStates = [game.fen()];
                currentHistoryIndex = 0;
                selectedSquare = null;
                renderBoard();
                updateMoveHistory();
                triggerAnalysis();
            });
            $('#btn-flip').click(() => {
                isFlipped = !isFlipped;
                renderBoard();
            });

            $('#btn-load-fen').click(() => {
                const inputVal = $('#load-fen-input').val().trim();
                if (!inputVal) return;
                const success = inputVal.includes('[Event') ? game.load_pgn(inputVal) : game.load(inputVal);
                if (success) {
                    historyStates = [];
                    const verboseMoves = game.history({ verbose: true });
                    const temp = new Chess();
                    historyStates.push(temp.fen());
                    for (const m of verboseMoves) {
                        temp.move(m);
                        historyStates.push(temp.fen());
                    }
                    currentHistoryIndex = historyStates.length - 1;
                    selectedSquare = null;
                    renderBoard();
                    updateMoveHistory();
                    triggerAnalysis();
                    $('#load-fen-input').val('');
                } else {
                    alert('Invalid FEN/PGN string.');
                }
            });
        });
    </script>
</body>
</html>
